name: horace-test

services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: horace_test
      POSTGRES_USER: horace_test
      POSTGRES_PASSWORD: horace_test
    ports:
      - "5439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horace_test -d horace_test"]
      interval: 2s
      timeout: 5s
      retries: 15
