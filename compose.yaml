services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horace
      POSTGRES_USER: horace
      POSTGRES_PASSWORD: horace_dev
    ports:
      - "5438:5432"
    volumes:
      - horace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horace -d horace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  horace_postgres_data:
